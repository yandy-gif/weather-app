<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E2338">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="气象台">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>气象观测台</title>
<style>
:root{
  --paper:#EEF3F7; --paper-hi:#F8FBFD;
  --ink:#0E2338; --ink-2:#38506A; --ink-soft:#6B8299;
  --rule:#C6D6E3; --pen:#C8362B; --sun:#D9922B; --sky:#4C7FA8;
  --serif:"Songti SC","SimSun","Source Han Serif SC","Noto Serif CJK SC",serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --bar:52px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--sans);color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(to right,rgba(76,127,168,.15) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(76,127,168,.15) 1px,transparent 1px),
    linear-gradient(to right,rgba(76,127,168,.09) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(76,127,168,.09) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  min-height:100vh;
}
/* 桌面打开时收成手机宽度居中，保持 App 观感 */
@media (min-width:640px){
  body{max-width:480px;margin:0 auto;box-shadow:0 0 0 1px var(--rule),0 20px 60px -30px rgba(14,35,56,.5)}
}
button{font-family:var(--sans);-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding-top:var(--safe-t);
  background:rgba(14,35,56,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(220,231,240,.14);
}
@media (min-width:640px){.topbar{left:50%;transform:translateX(-50%);width:480px}}
.bar-in{height:var(--bar);display:flex;align-items:center;gap:6px;padding:0 10px}
.citybtn{
  flex:1;min-width:0;display:flex;align-items:center;gap:6px;
  background:none;border:0;color:#fff;cursor:pointer;
  font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.08em;
  padding:10px 6px;text-align:left;
}
.citybtn .sub{font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.05em;color:rgba(220,231,240,.55);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citybtn svg{flex:none;opacity:.6}
.ibtn{
  flex:none;width:42px;height:42px;display:grid;place-items:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(220,231,240,.18);
  border-radius:10px;color:#DCE7F0;cursor:pointer;transition:background .15s;
}
.ibtn:active{background:rgba(255,255,255,.2)}
.ibtn.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.offtag{
  flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  color:#FFD9D5;background:rgba(200,54,43,.35);border:1px solid rgba(200,54,43,.6);
  border-radius:999px;padding:3px 8px;
}
.offtag[hidden]{display:none}

/* ---------- 下拉刷新 ---------- */
.pull{
  position:fixed;top:0;left:0;right:0;z-index:39;height:64px;
  display:flex;align-items:flex-end;justify-content:center;gap:8px;
  padding-bottom:6px;background:var(--paper);
  transform:translateY(-100%);will-change:transform;
  font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.08em;
}
@media (min-width:640px){.pull{left:50%;margin-left:-240px;width:480px}}
.pull .ring{
  width:14px;height:14px;border-radius:50%;
  border:2px solid var(--rule);border-top-color:var(--pen);
}
.pull.ready .ring{border-color:var(--pen)}

/* ---------- 主区 ---------- */
main{padding:calc(var(--bar) + var(--safe-t) + 12px) 12px calc(28px + var(--safe-b))}
.card{
  background:var(--paper-hi);border:1px solid var(--rule);border-radius:16px;
  box-shadow:0 8px 22px -16px rgba(14,35,56,.45);
  margin-bottom:12px;overflow:hidden;
}
.card-h{
  display:flex;align-items:baseline;gap:8px;
  padding:12px 14px 10px;border-bottom:1px solid var(--rule);
}
.card-h h2{font-family:var(--serif);font-size:13px;font-weight:700;letter-spacing:.16em;margin:0}
.card-h .note{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-soft)}

/* 当前 */
.now{display:flex;align-items:flex-end;gap:12px;padding:16px 14px 12px}
.now .left{flex:1;min-width:0}
.now .cond{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-size:17px;letter-spacing:.1em;color:var(--ink-2)}
.now .cond svg{color:var(--sky)}
.now .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-top:6px;line-height:1.7}
.now .temp{font-family:var(--mono);font-size:62px;font-weight:600;letter-spacing:-.04em;line-height:.9;font-variant-numeric:tabular-nums}
.now .temp .u{font-size:20px;color:var(--ink-soft);letter-spacing:0}
.keyrow{display:flex;border-top:1px solid var(--rule)}
.keyrow div{flex:1;padding:10px 6px;text-align:center;border-right:1px solid var(--rule)}
.keyrow div:last-child{border-right:0}
.keyrow .k{font-size:10px;letter-spacing:.14em;color:var(--ink-soft);margin:0 0 3px}
.keyrow .v{font-family:var(--mono);font-size:15px;font-weight:600;margin:0;font-variant-numeric:tabular-nums}
.keyrow .v .u{font-size:10px;font-weight:400;color:var(--ink-soft)}

/* 曲线 */
.chart{padding:8px 6px 2px}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{font-family:var(--mono);font-size:9px;fill:#8AA0B4}
.chart .rd{font-family:var(--mono);font-size:14px;font-weight:600;fill:#0E2338}
.chart .nw{font-family:var(--mono);font-size:9px;fill:#C8362B;letter-spacing:.14em}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;padding:8px 14px 12px;border-top:1px solid var(--rule)}
.lg{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
.lg i{width:18px;border-top:2px solid var(--sky)}
.lg.pen i{border-top-style:dashed;border-color:var(--pen)}

/* 读数 2 列 */
.gauges{display:grid;grid-template-columns:1fr 1fr}
.gauge{padding:12px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.gauge:nth-child(2n){border-right:0}
.gauge:nth-last-child(-n+2){border-bottom:0}
.gauge .k{font-size:10px;letter-spacing:.14em;color:var(--ink-soft);margin:0 0 4px}
.gauge .v{font-family:var(--mono);font-size:19px;font-weight:600;margin:0;font-variant-numeric:tabular-nums;line-height:1.1}
.gauge .v .u{font-size:10px;font-weight:400;color:var(--ink-soft)}
.gauge .s{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);margin:3px 0 0}

/* 七日 */
.days{padding:4px 12px 10px}
.scale{display:grid;grid-template-columns:46px 20px minmax(0,1fr) 30px minmax(56px,2fr) 30px 34px;gap:6px;padding:6px 0 6px;border-bottom:1px solid var(--rule)}
.scale .ticks{grid-column:5/6;position:relative;height:12px;font-family:var(--mono);font-size:9px;color:var(--ink-soft)}
.scale .ticks span{position:absolute;top:0}
.scale .ticks span:nth-child(2),.scale .ticks span:nth-child(4){display:none}
.day{display:grid;grid-template-columns:46px 20px minmax(0,1fr) 30px minmax(56px,2fr) 30px 34px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px dotted var(--rule)}
.day:last-child{border-bottom:0}
.day.today .d-date{color:var(--pen)}
.d-date{font-size:12.5px;font-weight:600;line-height:1.25}
.d-date span{display:block;font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--ink-soft)}
.d-ic{display:flex;color:var(--sky)}
.d-cond{font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-num{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.d-num.hi{color:var(--ink);font-weight:600}
.d-num.lo{text-align:right}
.d-track{position:relative;height:5px;border-radius:3px;background:#E1EAF2}
.d-bar{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--sky),var(--sun))}
.d-rain{font-family:var(--mono);font-size:10px;color:var(--sky);text-align:right}
.d-rain.zero{color:#A9BACA}

footer{padding:4px 6px 0;font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);line-height:1.9}
footer a{color:var(--ink-2)}

/* ---------- 今日穿搭 ---------- */
.outfit{padding:12px 14px}
.outfit .sum{font-family:var(--serif);font-size:14px;line-height:1.75;color:var(--ink-2);margin:0 0 10px}
.outfit .row{display:flex;gap:10px;padding:8px 0;border-top:1px dotted var(--rule)}
.outfit .row .k{flex:none;width:56px;font-size:10.5px;letter-spacing:.14em;color:var(--ink-soft);padding-top:3px}
.outfit .row .v{flex:1;font-size:13px;line-height:1.65;color:var(--ink)}

/* ---------- 城市对比 ---------- */
.cmpwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 14px}
.cmpgrid{display:flex;gap:8px;min-width:min-content}
.cmpcol{flex:none;width:106px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 8px 9px;text-align:center;position:relative}
.cmpcol .cn{font-size:12px;font-weight:600;margin:0 14px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmpcol .cx{position:absolute;top:3px;right:4px;border:0;background:none;color:var(--ink-soft);font-size:15px;line-height:1;cursor:pointer;padding:3px 5px}
.cmpcol .ci{color:var(--sky);margin:2px 0}
.cmpcol .ct{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.cmpcol .cd{font-family:var(--mono);font-size:10px;color:var(--ink-soft);margin-top:2px}
.cmpcol .cr{font-family:var(--mono);font-size:10px;margin-top:5px;color:var(--ink-soft)}
.cmpcol .cr.warmer{color:var(--pen)}
.cmpcol .cr.colder{color:var(--sky)}
.cmpadd{flex:none;width:74px;min-height:96px;border:1px dashed var(--rule);border-radius:12px;background:none;color:var(--ink-soft);font-size:12px;cursor:pointer;display:grid;place-items:center;line-height:1.5}
.cmpadd:active{background:#E3ECF4}
.cmpempty{padding:16px 14px;font-size:12.5px;color:var(--ink-soft);text-align:center;line-height:2}
.cmpempty .cmpadd{display:inline-grid;width:auto;min-height:0;padding:8px 16px;margin-top:4px}

/* ---------- 搜索全屏层 ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;background:var(--paper);
  transform:translateY(-100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column;
  background-image:
    linear-gradient(to right,rgba(76,127,168,.09) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(76,127,168,.09) 1px,transparent 1px);
  background-size:24px 24px;
}
.overlay.open{transform:translateY(0)}
.ov-head{padding:calc(var(--safe-t) + 8px) 12px 10px;display:flex;gap:8px;align-items:center;background:var(--ink)}
.ov-head input{
  flex:1;min-width:0;height:42px;padding:0 14px;font-size:15px;color:#fff;
  background:rgba(255,255,255,.1);border:1px solid rgba(220,231,240,.25);border-radius:10px;
}
.ov-head input::placeholder{color:rgba(220,231,240,.45)}
.ov-head input:focus{outline:none;border-color:var(--sun)}
.ov-cancel{flex:none;height:42px;padding:0 12px;background:none;border:0;color:#DCE7F0;font-size:14px;cursor:pointer}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px calc(20px + var(--safe-b))}
.ov-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-soft);margin:6px 2px 8px}
.results{list-style:none;margin:0;padding:0}
.results li button{
  width:100%;display:flex;align-items:baseline;gap:8px;padding:13px 12px;
  background:var(--paper-hi);border:1px solid var(--rule);border-radius:12px;margin-bottom:8px;
  font-size:15px;color:var(--ink);cursor:pointer;text-align:left;
}
.results li button:active{background:#E3ECF4}
.results .rname{font-weight:600}
.results .rmeta{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
.results .empty{padding:14px 12px;font-size:13px;color:var(--ink-soft);background:var(--paper-hi);border:1px dashed var(--rule);border-radius:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--ink-2);
  background:var(--paper-hi);border:1px solid var(--rule);border-radius:999px;
  padding:9px 16px;cursor:pointer;
}
.chip:active{background:#E3ECF4}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* 状态 */
.status{padding:30px 16px;text-align:center}
.status .big{font-family:var(--serif);font-size:15px;letter-spacing:.08em;margin:0 0 6px}
.status .sub{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:0;line-height:1.8}
.status .btn{margin-top:14px;padding:10px 22px;background:var(--ink);color:#fff;border:0;border-radius:10px;font-size:14px;cursor:pointer}
.skel{padding:18px 14px}
.skel-line{height:12px;margin-bottom:12px;border-radius:6px;background:linear-gradient(90deg,#E4ECF3 25%,#F1F6FA 50%,#E4ECF3 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

.reveal{opacity:0;transform:translateY(8px)}
.reveal.in{opacity:1;transform:none;transition:opacity .45s ease,transform .45s ease}

/* 安装到主屏幕引导条 */
.installbar{
  position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:70;
  background:var(--ink);color:#DCE7F0;border:1px solid rgba(220,231,240,.2);
  border-radius:14px;padding:12px 14px;box-shadow:0 12px 30px -12px rgba(14,35,56,.7);
  display:flex;gap:10px;align-items:center;
}
.installbar[hidden]{display:none}
.installbar .itxt{flex:1;font-size:12.5px;line-height:1.65}
.installbar .itxt b{color:var(--sun)}
.installbar button{flex:none;border:0;border-radius:9px;padding:9px 13px;font-size:12.5px;cursor:pointer}
.installbar .do{background:var(--sun);color:#20160A;font-weight:700}
.installbar .no{background:rgba(255,255,255,.1);color:rgba(220,231,240,.8)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2.6v2.4M12 19v2.4M2.6 12H5M19 12h2.4M5.4 5.4l1.7 1.7M16.9 16.9l1.7 1.7M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7"/></g></symbol>
  <symbol id="i-partial" viewBox="0 0 24 24"><circle cx="9" cy="8.4" r="3.4" fill="none" stroke="currentColor" stroke-width="1.5"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 2.6v1.6M3.2 8.4H1.6M4.9 4.3 3.8 3.2M13.1 4.3l1.1-1.1"/></g><path d="M8.6 18.4h9a3.1 3.1 0 0 0 .3-6.2 4.4 4.4 0 0 0-8.4-.9 3.6 3.6 0 0 0-.9 7.1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M6.4 18.6h11a3.4 3.4 0 0 0 .3-6.8 4.9 4.9 0 0 0-9.3-1 3.9 3.9 0 0 0-2 7.8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-rain" viewBox="0 0 24 24"><path d="M6.6 15.4h10.6a3.3 3.3 0 0 0 .3-6.6 4.7 4.7 0 0 0-9-1 3.8 3.8 0 0 0-1.9 7.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8.6 18.2 7.8 20.6M12.2 18.2l-.8 2.4M15.8 18.2 15 20.6"/></g></symbol>
  <symbol id="i-snow" viewBox="0 0 24 24"><path d="M6.6 15.2h10.6a3.3 3.3 0 0 0 .3-6.6 4.7 4.7 0 0 0-9-1 3.8 3.8 0 0 0-1.9 7.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8.4 18.4h.02M11.4 20h.02M14.4 18.4h.02M17.4 20h.02"/></g></symbol>
  <symbol id="i-storm" viewBox="0 0 24 24"><path d="M6.6 15.2h10.6a3.3 3.3 0 0 0 .3-6.6 4.7 4.7 0 0 0-9-1 3.8 3.8 0 0 0-1.9 7.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m12.6 16.8-3 3.6h2.6l-.8 2.8 3.4-4h-2.6Z" fill="currentColor"/></symbol>
  <symbol id="i-fog" viewBox="0 0 24 24"><path d="M7 13.4h9.8a3 3 0 0 0 .3-6 4.3 4.3 0 0 0-8.2-.9 3.5 3.5 0 0 0-1.9 6.9Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4.6 17h14.8M6.8 20.2h10.4"/></g></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M20 4v4.4h-4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<header class="topbar">
  <div class="bar-in">
    <button class="citybtn" id="cityBtn" type="button" aria-haspopup="dialog">
      <span id="cityName">—</span>
      <span class="sub" id="citySub"></span>
      <svg width="14" height="14"><use href="#i-chev"/></svg>
    </button>
    <span class="offtag" id="offTag" hidden>离线</span>
    <button class="ibtn" id="geoBtn" type="button" aria-label="使用当前位置"><svg width="19" height="19"><use href="#i-pin"/></svg></button>
    <button class="ibtn" id="refreshBtn" type="button" aria-label="刷新"><svg width="18" height="18"><use href="#i-refresh"/></svg></button>
  </div>
</header>

<div class="pull" id="pull" aria-hidden="true"><span class="ring"></span><span id="pullText">下拉刷新</span></div>

<main>
  <section class="card" id="nowCard" aria-label="当前天气"></section>
  <section class="card" aria-label="今日穿搭">
    <div class="card-h"><h2>今日穿搭</h2><span class="note" id="outfitNote">—</span></div>
    <div class="outfit" id="outfit"></div>
  </section>
  <section class="card" aria-label="24 小时气温曲线">
    <div class="card-h"><h2>24 小时自记曲线</h2><span class="note" id="chartNote">—</span></div>
    <div id="chartBox"></div>
  </section>
  <section class="card" aria-label="观测读数">
    <div class="card-h"><h2>读数</h2><span class="note">同时刻</span></div>
    <div class="gauges" id="gauges"></div>

<script>
(function(){
"use strict";
var WMO={0:["晴","i-sun"],1:["大致晴朗","i-partial"],2:["局部多云","i-partial"],3:["阴","i-cloud"],45:["雾","i-fog"],48:["雾凇","i-fog"],51:["毛毛雨","i-rain"],53:["毛毛雨","i-rain"],55:["浓毛毛雨","i-rain"],56:["冻毛毛雨","i-rain"],57:["冻毛毛雨","i-rain"],61:["小雨","i-rain"],63:["中雨","i-rain"],65:["大雨","i-rain"],66:["冻雨","i-rain"],67:["强冻雨","i-rain"],71:["小雪","i-snow"],73:["中雪","i-snow"],75:["大雪","i-snow"],77:["雪粒","i-snow"],80:["小阵雨","i-rain"],81:["阵雨","i-rain"],82:["强阵雨","i-rain"],85:["小阵雪","i-snow"],86:["大阵雪","i-snow"],95:["雷阵雨","i-storm"],96:["雷阵雨伴冰雹","i-storm"],99:["强雷暴伴冰雹","i-storm"]};
function wmo(c){return WMO[c]||["未知","i-cloud"];}
function icon(id,sz){return '<svg width="'+(sz||20)+'" height="'+(sz||20)+'" aria-hidden="true"><use href="#'+id+'"/></svg>';}
var DIRS=["北","东北偏北","东北","东北偏东","东","东南偏东","东南","东南偏南","南","西南偏南","西南","西南偏西","西","西北偏西","西北","西北偏北"];
function windDir(d){return DIRS[Math.round((d%360)/22.5)%16]+"风";}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return n<10?"0"+n:""+n;}
function fmt1(v){return (v==null||isNaN(v))?"—":(Math.round(v*10)/10).toFixed(1);}
function clock(){var n=new Date();return pad(n.getHours())+":"+pad(n.getMinutes());}

var CHIPS=[
  {name:"杭州",latitude:30.29365,longitude:120.16142,admin1:"浙江",country:"中国"},
  {name:"上海",latitude:31.22222,longitude:121.45806,admin1:"上海",country:"中国"},
  {name:"北京",latitude:39.9075,longitude:116.39723,admin1:"北京",country:"中国"},
  {name:"广州",latitude:23.11667,longitude:113.25,admin1:"广东",country:"中国"},
  {name:"成都",latitude:30.66667,longitude:104.06667,admin1:"四川",country:"中国"},
  {name:"三亚",latitude:18.25,longitude:109.5,admin1:"海南",country:"中国"}
];
var STORE="wx.app.v1";
var $=function(s){return document.querySelector(s);};
var nowCard=$("#nowCard"),chartBox=$("#chartBox"),gauges=$("#gauges"),days=$("#days");
var overlay=$("#overlay"),qEl=$("#q"),resEl=$("#res"),resLabel=$("#resLabel"),chipsEl=$("#chips");
var pull=$("#pull"),pullText=$("#pullText"),offTag=$("#offTag");
var refreshBtn=$("#refreshBtn"),geoBtn=$("#geoBtn");
var state={place:null,data:null,timer:null,cmp:[],cmpData:{}};
try{state.cmp=JSON.parse(localStorage.getItem("wx.cmp.v1")||"[]")||[];}catch(e){state.cmp=[];}
var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;

CHIPS.forEach(function(c){
  var b=document.createElement("button");
  b.type="button";b.className="chip";b.textContent=c.name;b.setAttribute("aria-pressed","false");
  b.addEventListener("click",function(){if(ovMode==="cmp"){addCmp(c);closeOverlay();}else{load(c,true);closeOverlay();}});
  chipsEl.appendChild(b);
});
function syncChips(n){Array.prototype.forEach.call(chipsEl.children,function(b,i){b.setAttribute("aria-pressed",String(CHIPS[i].name===n));});}

function buildURL(p){
  return "https://api.open-meteo.com/v1/forecast"
   +"?latitude="+encodeURIComponent(p.latitude)+"&longitude="+encodeURIComponent(p.longitude)
   +"&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,precipitation,cloud_cover,is_day"
   +"&hourly=temperature_2m,precipitation_probability,weather_code"
   +"&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,wind_speed_10m_max,uv_index_max"
   +"&timezone=auto&forecast_days=7&past_days=1";
}
function load(place,save){
  if(!place)return;
  state.place=place;
  if(save!==false){try{localStorage.setItem(STORE,JSON.stringify(place));}catch(e){}}
  syncChips(place.name);
  $("#cityName").textContent=place.name;
  $("#citySub").textContent=[place.admin1,place.country].filter(Boolean).join("·");
  refreshBtn.classList.add("spin");
  nowCard.innerHTML='<div class="skel"><div class="skel-line" style="width:45%"></div><div class="skel-line" style="width:70%;height:56px"></div></div>';
  chartBox.innerHTML="";gauges.innerHTML="";days.innerHTML="";
  fetch(buildURL(place),{headers:{Accept:"application/json"}})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(d){
      if(!d.current||!d.hourly||!d.daily)throw new Error("数据字段缺失");
      state.data=d;refreshBtn.classList.remove("spin");
      render();
      loadCmp();
      clearTimeout(state.timer);
      state.timer=setTimeout(function(){load(place,false);},15*60*1000);
    })
    .catch(function(err){
      refreshBtn.classList.remove("spin");
      nowCard.innerHTML='<div class="status"><p class="big">未能取到 '+esc(place.name)+' 的观测数据</p>'
        +'<p class="sub">'+esc(err.message||err)+'<br>检查网络连接，或稍后重试</p>'
        +'<button class="btn" id="retry" type="button">重试</button></div>';
      var rb=$("#retry");if(rb)rb.addEventListener("click",function(){load(place,false);});
    });
}
function nowIndex(d){
  var t=d.current.time.slice(0,13);
  var i=d.hourly.time.findIndex(function(x){return x.slice(0,13)===t;});
  if(i<0){var now=Date.now(),best=0,bd=Infinity;
    d.hourly.time.forEach(function(x,k){var df=Math.abs(new Date(x).getTime()-now);if(df<bd){bd=df;best=k;}});i=best;}
  return i;
}
function todayIndex(d){var i=d.daily.time.indexOf(d.current.time.slice(0,10));return i<0?Math.min(1,d.daily.time.length-1):i;}

function render(){
  var d=state.data,c=d.current,ni=nowIndex(d),ti=todayIndex(d),w=wmo(c.weather_code);
  var sr=(d.daily.sunrise[ti]||"").slice(11,16),ss=(d.daily.sunset[ti]||"").slice(11,16);

  nowCard.innerHTML=
    '<div class="now reveal">'
    +'<div class="left">'
    +  '<p class="cond">'+icon(w[1],22)+esc(w[0])+'</p>'
    +  '<p class="meta">观测于 '+esc(c.time.replace("T"," "))+'<br>体感 '+fmt1(c.apparent_temperature)+'° · '+windDir(c.wind_direction_10m)+' '+fmt1(c.wind_speed_10m)+' km/h</p>'
    +'</div>'
    +'<div class="temp">'+fmt1(c.temperature_2m)+'<span class="u">°C</span></div>'
    +'</div>'
    +'<div class="keyrow reveal">'
    +'<div><p class="k">湿度</p><p class="v">'+Math.round(c.relative_humidity_2m)+'<span class="u">%</span></p></div>'
    +'<div><p class="k">降水概率</p><p class="v">'+(d.hourly.precipitation_probability[ni]==null?"—":Math.round(d.hourly.precipitation_probability[ni]))+'<span class="u">%</span></p></div>'
    +'<div><p class="k">日出</p><p class="v">'+(sr||"—")+'</p></div>'
    +'<div><p class="k">日落</p><p class="v">'+(ss||"—")+'</p></div>'
    +'</div>';

  $("#chartNote").textContent="过去6h 实测 · 未来18h 预报";
  drawChart(d,ni);
  renderOutfit(d,ti);

  var rows=[
    ["体感温度",fmt1(c.apparent_temperature),"°C","实测 "+fmt1(c.temperature_2m)+"°"],
    ["相对湿度",Math.round(c.relative_humidity_2m),"%",c.relative_humidity_2m>70?"偏湿":(c.relative_humidity_2m<35?"干燥":"舒适")],
    ["风",windDir(c.wind_direction_10m),"",fmt1(c.wind_speed_10m)+" km/h"],
    ["气压",fmt1(c.pressure_msl),"hPa",c.pressure_msl<1005?"偏低":(c.pressure_msl>1025?"偏高":"正常")],
    ["云量",Math.round(c.cloud_cover),"%","降水 "+fmt1(c.precipitation)+" mm"],
    ["紫外线峰值",d.daily.uv_index_max[ti]==null?"—":d.daily.uv_index_max[ti].toFixed(1),"",uvLabel(d.daily.uv_index_max[ti])],
    ["最大风速",fmt1(d.daily.wind_speed_10m_max[ti]),"km/h","今日"],
    ["降水峰值",d.daily.precipitation_probability_max[ti]==null?"—":Math.round(d.daily.precipitation_probability_max[ti]),"%","今日概率"]
  ];
  gauges.innerHTML=rows.map(function(r){
    var v=r[2]===""?esc(r[1]):esc(r[1])+'<span class="u">'+esc(r[2])+'</span>';
    return '<div class="gauge reveal"><p class="k">'+esc(r[0])+'</p><p class="v">'+v+'</p><p class="s">'+esc(r[3])+'</p></div>';
  }).join("");

  var start=ti,n=Math.min(7,d.daily.time.length-start),lo=Infinity,hi=-Infinity,i;
  for(i=start;i<start+n;i++){lo=Math.min(lo,d.daily.temperature_2m_min[i]);hi=Math.max(hi,d.daily.temperature_2m_max[i]);}
  var span=(hi-lo)||1,ticks=[lo,lo+span*.25,lo+span*.5,lo+span*.75,hi];
  var wd=["周日","周一","周二","周三","周四","周五","周六"];
  var dh='<div class="scale"><div class="ticks">'+ticks.map(function(t,k){
    var tr=k===0?"translateX(0)":(k===ticks.length-1?"translateX(-100%)":"translateX(-50%)");
    return '<span style="left:'+(k*25)+'%;transform:'+tr+'">'+Math.round(t)+'°</span>';}).join("")+'</div></div>';
  for(i=start;i<start+n;i++){
    var a=d.daily.temperature_2m_min[i],b=d.daily.temperature_2m_max[i];
    var left=((a-lo)/span*100),width=Math.max(2,((b-a)/span*100));
    var dt=new Date(d.daily.time[i]+"T12:00:00");
    var dw=(i===start)?"今日":wd[dt.getDay()];
    var pop=d.daily.precipitation_probability_max[i],ww=wmo(d.daily.weather_code[i]);
    dh+='<div class="day'+(i===start?" today":"")+' reveal">'
      +'<div class="d-date">'+dw+'<span>'+d.daily.time[i].slice(5).replace("-","/")+'</span></div>'
      +'<div class="d-ic">'+icon(ww[1],18)+'</div>'
      +'<div class="d-cond">'+esc(ww[0])+'</div>'
      +'<div class="d-num lo">'+fmt1(a)+'°</div>'
      +'<div class="d-track"><div class="d-bar" style="left:'+left.toFixed(2)+'%;width:'+width.toFixed(2)+'%"></div></div>'
      +'<div class="d-num hi">'+fmt1(b)+'°</div>'
      +'<div class="d-rain'+(pop?"":" zero")+'">'+(pop==null?"—":Math.round(pop)+"%")+'</div></div>';
  }
  days.innerHTML=dh;
  $("#footNote").textContent="站点 "+d.latitude.toFixed(2)+"°N "+d.longitude.toFixed(2)+"°E · 海拔 "+Math.round(d.elevation)+"m · 载入 "+clock();
  reveal();
}
function uvLabel(v){if(v==null)return "—";if(v<3)return "弱";if(v<6)return "中等·防晒";if(v<8)return "强·防晒";if(v<11)return "很强";return "极强";}

/* 今日穿搭：按最高/最低温、昼夜温差、降水、风、紫外线给建议 */
function outfit(d,ti){
  var dd=d.daily,hi=dd.temperature_2m_max[ti],lo=dd.temperature_2m_min[ti];
  var pop=dd.precipitation_probability_max[ti],wind=dd.wind_speed_10m_max[ti],uv=dd.uv_index_max[ti];
  var code=dd.weather_code[ti],w=wmo(code);
  var wet=(code>=51&&code<=67)||(code>=80&&code<=82)||(code>=95&&code<=99);
  var snowy=(code>=66&&code<=67)||(code>=71&&code<=77)||(code>=85&&code<=86);
  var rainy=(pop!=null&&pop>=50)||wet;
  var top,bot,shoe,gear=[],notes=[];
  if(hi<=-5){top="厚羽绒服 + 厚毛衣 + 保暖内衣";bot="羽绒裤 / 加绒厚裤";shoe="雪地靴 / 加绒靴";gear.push("围巾 + 手套 + 帽子");}
  else if(hi<=5){top="羽绒服 / 厚大衣 + 毛衣";bot="厚裤，可加保暖裤";shoe="靴子 / 皮鞋";gear.push("围巾 + 手套");}
  else if(hi<=10){top="大衣 / 厚夹克 + 针织衫";bot="长裤";shoe="皮鞋 / 运动鞋";gear.push("备一条围巾");}
  else if(hi<=16){top="夹克 / 风衣 + 长袖";bot="长裤";shoe="运动鞋";}
  else if(hi<=22){top="长袖 / 衬衫 + 薄外套";bot="长裤 / 长裙";shoe="运动鞋 / 单鞋";}
  else if(hi<=27){top="短袖或薄长袖";bot="薄长裤 / 裙装";shoe="运动鞋 / 凉鞋";}
  else{top="短袖、透气面料";bot="短裤 / 裙装";shoe="凉鞋 / 透气鞋";gear.push("防暑补水");}
  if(hi-lo>=10)notes.push("昼夜温差 "+Math.round(hi-lo)+"°，加一件易穿脱的外套");
  if(lo<=4&&hi>=14)notes.push("早晚偏凉，洋葱式叠穿");
  if(rainy)gear.push(snowy?"带伞 + 防滑鞋":"带伞，鞋选防水");
  if(wind!=null&&wind>=30)gear.push("风 "+Math.round(wind)+" km/h，外套选防风");
  if(uv!=null&&uv>=6)gear.push("紫外线 "+uv.toFixed(0)+"（"+(uv>=8?"强":"中等")+"），防晒衣 / 防晒霜");
  if(!gear.length)gear.push("无特殊装备，轻松出门");
  var sum="今日"+w[0]+"，"+Math.round(lo)+"~"+Math.round(hi)+"°C。"+top+"。"+(notes.length?notes.join("；")+"。":"");
  return {sum:sum,rows:[["上装",top],["下装",bot],["鞋",shoe],["出门装备",gear.join("；")]]};
}
function renderOutfit(d,ti){
  var o=outfit(d,ti);
  var wd=["周日","周一","周二","周三","周四","周五","周六"];
  var dt=new Date(d.daily.time[ti]+"T12:00:00");
  $("#outfitNote").textContent=d.daily.time[ti].slice(5).replace("-","/")+" "+wd[dt.getDay()];
  $("#outfit").innerHTML='<p class="sum reveal">'+esc(o.sum)+'</p>'
    +o.rows.map(function(r){return '<div class="row reveal"><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></div>';}).join("");
}

/* 城市对比 */
function cmpKey(p){return p.latitude.toFixed(2)+","+p.longitude.toFixed(2);}
function saveCmp(){try{localStorage.setItem("wx.cmp.v1",JSON.stringify(state.cmp));}catch(e){}}
function buildCmpURL(p){
  return "https://api.open-meteo.com/v1/forecast"
   +"?latitude="+encodeURIComponent(p.latitude)+"&longitude="+encodeURIComponent(p.longitude)
   +"&current=temperature_2m,apparent_temperature,weather_code"
   +"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
   +"&timezone=auto&forecast_days=1";
}
function loadCmp(){
  renderCmp();
  var items=state.cmp||[];
  if(!items.length)return;
  Promise.all(items.map(function(p){
    return fetch(buildCmpURL(p),{headers:{Accept:"application/json"}})
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(function(j){var o={};o[cmpKey(p)]=j;return o;})
      .catch(function(){var o={};o[cmpKey(p)]=null;return o;});
  })).then(function(rs){
    var m={};
    rs.forEach(function(o){Object.keys(o).forEach(function(k){m[k]=o[k];});});
    state.cmpData=m;renderCmp();
  });
}
function addCmp(p){
  if(!p)return;
  state.cmp=state.cmp||[];
  if(state.cmp.length>=4){alert("最多对比 4 个城市");return;}
  var dup=state.cmp.some(function(x){return x.name===p.name&&Math.abs(x.latitude-p.latitude)<0.01;});
  if(dup){renderCmp();return;}
  state.cmp.push(p);saveCmp();loadCmp();
}
function rmCmp(i){state.cmp.splice(i,1);saveCmp();loadCmp();}
function renderCmp(){
  var wrap=$("#cmpwrap"),items=state.cmp||[];
  if(!items.length){
    wrap.innerHTML='<div class="cmpempty">把别的城市加进来，和「'+esc(state.place?state.place.name:"当前城市")+'」并排比温度、天气和降水概率。<br><button class="cmpadd" id="cmpAdd" type="button">＋ 添加城市</button></div>';
  }else{
    var base=(state.data&&state.data.current)?state.data.current.temperature_2m:null;
    var h='<div class="cmpgrid">';
    items.forEach(function(p,i){
      var cd=state.cmpData?state.cmpData[cmpKey(p)]:null;
      h+='<div class="cmpcol"><button class="cx" type="button" data-i="'+i+'" aria-label="移除'+esc(p.name)+'">×</button><p class="cn">'+esc(p.name)+'</p>';
      if(!cd){h+='<div class="cd">载入中…</div></div>';return;}
      var c=cd.current,w=wmo(c.weather_code);
      var diff=(base!=null&&c.temperature_2m!=null)?Math.round((c.temperature_2m-base)*10)/10:null;
      var dtxt=(diff==null)?"":(diff>0?"比此地 +"+diff+"°":(diff<0?"比此地 "+diff+"°":"与此地持平"));
      h+='<div class="ci">'+icon(w[1],20)+'</div>'
        +'<div class="ct">'+fmt1(c.temperature_2m)+'°</div>'
        +'<div class="cd">'+fmt1(cd.daily.temperature_2m_min[0])+'~'+fmt1(cd.daily.temperature_2m_max[0])+'°</div>'
        +'<div class="cd">降水 '+(cd.daily.precipitation_probability_max[0]==null?"—":Math.round(cd.daily.precipitation_probability_max[0])+"%")+'</div>'
        +'<div class="cr '+(diff>0?"warmer":(diff<0?"colder":""))+'">'+dtxt+'</div></div>';
    });
    h+='</div>';
    if(items.length<4)h+='<div style="display:flex;margin-top:8px"><button class="cmpadd" id="cmpAdd" type="button" style="width:100%;min-height:0;padding:9px">＋ 添加对比城市</button></div>';
    wrap.innerHTML=h;
  }
  var add=wrap.querySelector("#cmpAdd");
  if(add)add.addEventListener("click",function(){openOverlay("cmp");});
  Array.prototype.forEach.call(wrap.querySelectorAll(".cx"),function(b){
    b.addEventListener("click",function(){rmCmp(+b.dataset.i);});
  });
}
function reveal(){
  var els=document.querySelectorAll(".reveal");
  if(reduced){Array.prototype.forEach.call(els,function(e){e.classList.add("in");});return;}
  Array.prototype.forEach.call(els,function(e,k){setTimeout(function(){e.classList.add("in");},50*k);});
}

function drawChart(d,ni){
  var from=Math.max(0,ni-6),to=Math.min(d.hourly.time.length-1,ni+18);
  var temps=d.hourly.temperature_2m.slice(from,to+1),times=d.hourly.time.slice(from,to+1);
  var split=ni-from;
  var W=Math.max(300,chartBox.clientWidth-12),H=190,padL=30,padR=10,padT=16,padB=26;
  var iw=W-padL-padR,ih=H-padT-padB;
  var lo=Math.min.apply(null,temps),hi=Math.max.apply(null,temps);
  if(hi-lo<2)hi=lo+2;
  var pd=(hi-lo)*.18;lo-=pd;hi+=pd;
  function X(i){return padL+(temps.length<2?0:iw*i/(temps.length-1));}
  function Y(t){return padT+ih*(1-(t-lo)/(hi-lo));}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="过去6小时到未来18小时气温曲线">';
  for(var k=0;k<=4;k++){
    var tv=lo+(hi-lo)*k/4,y=Y(tv);
    s+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="'+(k===0?"#B9CBDA":"#D6E2EC")+'" stroke-width="1"/>';
    s+='<text class="ax" x="'+(padL-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+Math.round(tv)+'°</text>';
  }
  for(var i=0;i<times.length-1;i++){
    var hh=parseInt(times[i].slice(11,13),10);
    if(hh>=19||hh<6)s+='<rect x="'+X(i).toFixed(1)+'" y="'+padT+'" width="'+(X(i+1)-X(i)).toFixed(1)+'" height="'+ih+'" fill="#0E2338" opacity="0.04"/>';
  }
  function path(a,b){var p="";for(var j=a;j<=b;j++)p+=(j===a?"M":"L")+X(j).toFixed(1)+" "+Y(temps[j]).toFixed(1);return p;}
  s+='<defs><clipPath id="clipB"><rect id="clipRect" x="'+padL+'" y="0" width="0" height="'+H+'"/></clipPath></defs>';
  s+='<path id="pathA" d="'+path(0,Math.max(0,split))+'" fill="none" stroke="#4C7FA8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  s+='<g clip-path="url(#clipB)"><path d="'+path(split,temps.length-1)+'" fill="none" stroke="#C8362B" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/></g>';
  var cx=X(split),cy=Y(temps[split]);
  s+='<line x1="'+cx.toFixed(1)+'" y1="'+padT+'" x2="'+cx.toFixed(1)+'" y2="'+(padT+ih)+'" stroke="#C8362B" stroke-width="1" opacity=".35"/>';
  s+='<g id="nib" opacity="0"><circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="8" fill="#C8362B" opacity=".15"/><circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3.4" fill="#C8362B"/></g>';
  var lx=cx+10,anchor="start";
  if(lx+64>W-padR){lx=cx-10;anchor="end";}
  s+='<g id="tag" opacity="0"><text class="rd" x="'+lx.toFixed(1)+'" y="'+(cy-10).toFixed(1)+'" text-anchor="'+anchor+'">'+fmt1(temps[split])+'°C</text>'
    +'<text class="nw" x="'+lx.toFixed(1)+'" y="'+(cy+2).toFixed(1)+'" text-anchor="'+anchor+'">NOW</text></g>';
  for(i=0;i<times.length;i+=4){
    s+='<line x1="'+X(i).toFixed(1)+'" y1="'+(padT+ih)+'" x2="'+X(i).toFixed(1)+'" y2="'+(padT+ih+3)+'" stroke="#B9CBDA" stroke-width="1"/>';
    s+='<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(padT+ih+14)+'" text-anchor="middle">'+times[i].slice(11,16)+'</text>';
  }
  s+='</svg>';
  chartBox.innerHTML='<div class="chart">'+s+'</div>'
    +'<div class="legendrow"><span class="lg"><i></i>已记录</span><span class="lg pen"><i></i>预报</span></div>';
  var svgEl=chartBox.querySelector("svg"),pathA=svgEl.querySelector("#pathA"),clipRect=svgEl.querySelector("#clipRect");
  var nib=svgEl.querySelector("#nib"),tag=svgEl.querySelector("#tag");
  var lenA=pathA.getTotalLength(),fullW=W-padL-padR;
  function setP(p){
    var pa=Math.min(1,p/0.3);
    pathA.style.strokeDasharray=lenA;pathA.style.strokeDashoffset=lenA*(1-pa);
    var pb=p<=0.3?0:Math.min(1,(p-0.3)/0.7);
    clipRect.setAttribute("width",(fullW*pb).toFixed(1));
    nib.setAttribute("opacity",pa>=1?"1":"0");
    tag.setAttribute("opacity",pb>0.06?"1":"0");
  }
  if(reduced){setP(1);return;}
  var t0=null;
  function frame(ts){if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/1400);setP(1-Math.pow(1-p,3));if(p<1)requestAnimationFrame(frame);}
  setP(0);requestAnimationFrame(frame);
}

/* 搜索层 */
var ovMode="main";
function openOverlay(mode){ovMode=mode||"main";qEl.placeholder=ovMode==="cmp"?"搜索要对比的城市：深圳 / Paris":"搜索城市：杭州 / Tokyo";overlay.classList.add("open");setTimeout(function(){qEl.focus();},120);}
function closeOverlay(){overlay.classList.remove("open");qEl.blur();closeRes();}
$("#cityBtn").addEventListener("click",function(){openOverlay("main");});
$("#closeOv").addEventListener("click",closeOverlay);
var deb=null,cand=[],cur=-1;
qEl.addEventListener("input",function(){clearTimeout(deb);var v=qEl.value.trim();if(!v){closeRes();return;}deb=setTimeout(function(){search(v);},280);});
function search(v){
  fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=zh&format=json&name="+encodeURIComponent(v))
   .then(function(r){return r.ok?r.json():Promise.reject(new Error("HTTP "+r.status));})
   .then(function(j){
     cand=(j.results||[]).map(function(x){return{name:x.name,latitude:x.latitude,longitude:x.longitude,admin1:x.admin1||"",country:x.country||""};});
     if(!cand.length){resEl.innerHTML='<li class="empty">没有找到「'+esc(v)+'」，换个写法试试（拼音或英文名）</li>';resLabel.hidden=false;return;}
     resEl.innerHTML=cand.map(function(c,i){
       return '<li><button type="button" data-i="'+i+'"><span class="rname">'+esc(c.name)+'</span><span class="rmeta">'+esc([c.admin1,c.country].filter(Boolean).join(" · "))+'</span></button></li>';
     }).join("");
     Array.prototype.forEach.call(resEl.querySelectorAll("button"),function(b){
       b.addEventListener("click",function(){if(ovMode==="cmp"){addCmp(cand[+b.dataset.i]);closeOverlay();}else{load(cand[+b.dataset.i],true);closeOverlay();}});
     });
     resLabel.hidden=false;
   })
   .catch(function(err){resEl.innerHTML='<li class="empty">搜索失败：'+esc(err.message||err)+'</li>';resLabel.hidden=false;});
}
function closeRes(){resEl.innerHTML="";resLabel.hidden=true;}

/* 定位 / 刷新 */
geoBtn.addEventListener("click",function(){
  if(!navigator.geolocation){alert("浏览器不支持定位，请用搜索。");return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    load({name:"我的位置",latitude:+pos.coords.latitude.toFixed(4),longitude:+pos.coords.longitude.toFixed(4),admin1:"",country:""},true);
  },function(err){
    alert((err.code===1?"定位权限被拒绝":(err.code===3?"定位超时":"无法获取位置"))+"。可点城市名搜索。");
  },{timeout:10000,maximumAge:600000});
});
refreshBtn.addEventListener("click",function(){if(state.place)load(state.place,false);});

/* 下拉刷新 */
var pullY=null,pulling=false;
document.addEventListener("touchstart",function(e){if(window.scrollY<=0)pullY=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchmove",function(e){
  if(pullY===null)return;
  var dy=e.touches[0].clientY-pullY;
  if(dy>0&&window.scrollY<=0){
    pulling=true;
    var h=Math.min(64,dy*0.45);
    pull.style.transform="translateY("+(-100+(h/64)*100)+"%)";
    pull.classList.toggle("ready",dy>110);
    pullText.textContent=dy>110?"松开立即刷新":"下拉刷新";
  }
},{passive:true});
document.addEventListener("touchend",function(){
  if(pulling&&pull.classList.contains("ready")&&state.place)load(state.place,false);
  pull.style.transform="";pull.classList.remove("ready");pullY=null;pulling=false;
});

/* 在线状态 */
function setOnline(){offTag.hidden=navigator.onLine;}
window.addEventListener("online",setOnline);
window.addEventListener("offline",setOnline);
setOnline();

/* 重绘 */
var rz=null;
window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){if(state.data)drawChart(state.data,nowIndex(state.data));},180);});

/* PWA */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}

/* 安装到主屏幕引导 */
(function(){
  var bar=$("#installbar"),txt=$("#installTxt"),doBtn=$("#installDo"),noBtn=$("#installNo");
  var DISMISS="wx.app.installdismiss";
  function standalone(){
    return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;
  }
  var UA=navigator.userAgent;
  var isIOS=/iPhone|iPad|iPod/.test(UA);
  var isAndroid=/Android/.test(UA);
  var deferred=null;
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;show();});
  function show(){
    if(standalone())return;
    if(!(isIOS||isAndroid))return;
    try{if(localStorage.getItem(DISMISS))return;}catch(e){}
    txt.innerHTML=isIOS
      ?'想把它变成手机 App？点 Safari 底部 <b>分享</b> → <b>添加到主屏幕</b>，即可像软件一样全屏打开。'
      :'想把它变成手机 App？点浏览器右上 <b>⋮</b> → <b>添加到主屏幕 / 安装应用</b>，即可像软件一样全屏打开。';
    bar.hidden=false;
    if(deferred)doBtn.hidden=false;
  }
  doBtn.addEventListener("click",function(){
    if(!deferred)return;
    deferred.prompt();
    deferred.userChoice.then(function(){deferred=null;doBtn.hidden=true;});
  });
  noBtn.addEventListener("click",function(){bar.hidden=true;try{localStorage.setItem(DISMISS,"1");}catch(e){}});
  show();
})();

/* 启动 */
var saved=null;
try{saved=JSON.parse(localStorage.getItem(STORE)||"null");}catch(e){}
load(saved&&typeof saved.latitude==="number"?saved:CHIPS[0],false);
})();
</script>
